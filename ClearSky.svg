<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="120" height="120">
  <!-- Sun -->
  <circle cx="20" cy="20" r="8" fill="#FFEB3B"></circle>
  <!-- Sun rays -->
  <g stroke="#FFEB3B" stroke-width="2">
    <line x1="20" y1="4" x2="20" y2="0"></line>
    <line x1="20" y1="36" x2="20" y2="40"></line>
    <line x1="4" y1="20" x2="0" y2="20"></line>
    <line x1="36" y1="20" x2="40" y2="20"></line>
    <line x1="8" y1="8" x2="4" y2="4"></line>
    <line x1="32" y1="8" x2="36" y2="4"></line>
    <line x1="8" y1="32" x2="4" y2="36"></line>
    <line x1="32" y1="32" x2="36" y2="36"></line>
  </g>
  <!-- Cloud -->
  <ellipse cx="40" cy="36" rx="14" ry="8" fill="#90A4AE"></ellipse>
  <ellipse cx="48" cy="36" rx="10" ry="6" fill="#B0BEC5"></ellipse>
</svg>
